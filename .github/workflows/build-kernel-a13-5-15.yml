name: Compile kernel a13-5-15

permissions:
  contents: write  # Allow writing to repository contents (for pushing tags)
  actions: write   # Allows triggering actions
  
on:
  workflow_dispatch:
    inputs:
      kernelsu_variant:
        description: "Select KernelSU"
        required: true
        type: choice
        options:
          - Official
          - Next
          - MKSU
          - SukiSU
        default: SukiSU
      kernelsu_branch:
        description: "Choose the KSU branch"
        required: true
        type: choice
        options:
          - Stable (Standard)
          - Dev (Development)
          - Other (Other/Specified)
        default: Dev (Development)
      version:
        description: 'Custom version name (e.g., 5.15.178; leave the following characters / blank to use the default version number).)'
        required: false
        type: string
      use_zram:
        description: 'Should we enable adding more ZRAM algorithms?'
        required: true
        type: boolean
        default: true
      use_kpm:
        description: 'Should we enable the KPM feature?'
        required: true
        type: boolean
        default: true
      set_defbbr:
        description: 'Should BBR be set as the default congestion algorithm? (Experimental)'
        required: true
        type: boolean
        default: false
      get_manager:
        description: 'Should I also get the latest KSU Manager? (Experimental feature, please disable if errors occur)'
        required: true
        type: boolean
        default: true
jobs:

  build-kernel-a13-5-15:
    uses: ./.github/workflows/kernel-a13-5.15.yml
    secrets: inherit
    with:
      make_release: false
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      kernelsu_branch: ${{ inputs.kernelsu_branch }}
      version: ${{ inputs.version }}
      use_zram: ${{ inputs.use_zram }}
      use_kpm: ${{ inputs.use_kpm }}
  get-ksu-manager:
    if: ${{ inputs.get_manager }}
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}

